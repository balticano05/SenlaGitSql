      author: Aleksey Yasiukevich
      preConditions:
        - onFail: WARN
        - tableIsEmpty:
            tableName: reviews
      changes:
        - sqlFile:
            encoding: utf8
            path: sql/15.insert-reviews.sql
            relativeToChangelogFile: true

  - changeSet:
      id: homework-2-insert-course-categories
      author: Aleksey Yasiukevich
      preConditions:
        - onFail: WARN
