databaseChangeLog:
  - changeSet:
      id: homework-2-roles
      author: Aleksey Yasiukevich
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR

  - changeSet:
      id: homework-2-users
      author: Aleksey Yasiukevich
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: email
                  type: VARCHAR(254)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_users_role_id

  - changeSet:
      id: homework-2-role-idx
      author: Aleksey Yasiukevich
      changes:
        - createIndex:
            indexName: idx_role_id
            tableName: users
            columns:
              - column:
                  name: role_id

  - changeSet:
      id: homework-2-courses
      author: Aleksey Yasiukevich
      changes:
        - createTable:
            tableName: courses
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: title
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR
              - column:
                  name: price
                  type: DECIMAL(10, 2)
                  constraints:
                    nullable: false
                    checkConstraint: price >= 0
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: homework-2-plans
      author: Aleksey Yasiukevich
      changes:
        - createTable:
            tableName: course_plans
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: lesson_count
                  type: INTEGER
                  constraints:
                    nullable: false
                    checkConstraint: lesson_count >= 0
              - column:
                  name: practice_count
                  type: INTEGER
                  constraints:
                    nullable: false
                    checkConstraint: practice_count >= 0
              - column:
                  name: duration
                  type: INTEGER
                  constraints:
                    nullable: false
                    checkConstraint: duration >= 0
        - addForeignKeyConstraint:
            baseTableName: course_plans
            baseColumnNames: id
            referencedTableName: courses
            referencedColumnNames: id
            constraintName: fk_course_plans_course_id
            onDelete: CASCADE

  - changeSet:
      id: homework-2-categories
      author: Aleksey Yasiukevich
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(60)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR

  - changeSet:
      id: homework-2-reviews
      author: Aleksey Yasiukevich
      changes:
        - createTable:
            tableName: reviews
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: course_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: VARCHAR
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: rating
                  type: INTEGER
                  constraints:
                    nullable: false
                    checkConstraint: rating >= 0
        - addForeignKeyConstraint:
            baseTableName: reviews
            baseColumnNames: course_id
            referencedTableName: courses
            referencedColumnNames: id
            constraintName: fk_reviews_course_id
            onDelete: CASCADE

  - changeSet:
      id: homework-2-course-category
      author: Aleksey Yasiukevich
      changes:
        - createTable:
            tableName: course_categories
            columns:
              - column:
                  name: course_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
        - addForeignKeyConstraint:
            baseTableName: course_categories
            baseColumnNames: course_id
            referencedTableName: courses
            referencedColumnNames: id
            constraintName: fk_course_categories_course_id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: course_categories
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_course_categories_category_id
            onDelete: CASCADE

  - changeSet:
      id: homework-2-transactions
      author: Aleksey Yasiukevich
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: course_id
                  type: INT
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: datetime
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
                    checkConstraint: price >= 0
        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: course_id
            referencedTableName: courses
            referencedColumnNames: id
            constraintName: fk_transactions_course_id

  - changeSet:
      id: homework-2-insert-roles
      author: Aleksey Yasiukevich
      preConditions:
          - onFail: WARN
          - tableIsEmpty:
              tableName: roles
      changes:
        - sqlFile:
            encoding: utf8
            path: sql/10.insert-roles.sql
            relativeToChangelogFile: true

  - changeSet:
      id: homework-2-insert-users
      author: Aleksey Yasiukevich
      preConditions:
        - onFail: WARN
        - tableIsEmpty:
